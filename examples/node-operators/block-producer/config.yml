# --8<-- [start:producer-config]
# Verified against koinos/koinos@821674672e699bf56e94d7c0e8bce122e83d1482.
# Replace the producer address only after verifying it on mainnet.
global:
  amqp: amqp://guest:guest@amqp:5672/
  log-level: info
  log-color: true
  log-datetime: true
  log-dir: logs
  instance-id: Koinos
  fork-algorithm: pob
  blacklist:
    - block_store.add_block
    - chain.propose_block

block_producer:
  algorithm: pob
  producer: REPLACE_WITH_PRODUCER_ADDRESS
  private-key-file: private.key
  pob-production: 100

chain:
  verify-blocks: true

grpc:
  endpoint: 0.0.0.0:50051

jsonrpc:
  listen: /tcp/8080

p2p:
  listen: /ip4/0.0.0.0/tcp/8888
  peer:
    - /dns4/seed.koinosblocks.com/tcp/8888/p2p/QmUNURuZxSu5wLnmBNJdwGtwjLmV5JxGhu4uNSAS8ZNcze
    - /dns4/seed.koinosfoundation.org/tcp/8888/p2p/QmQVBuhg2j2BV1hvMMNoLVrZ9T9gPb8F9bRgifCspBz6WW
# --8<-- [end:producer-config]
